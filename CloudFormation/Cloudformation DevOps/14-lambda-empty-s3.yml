Parameters:
  BucketName:
    Description: Existing S3 bucket this custom resource is allowed to empty
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'

Resources: 
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies:
      - PolicyName: root
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - "s3:ListBucket"
            Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketName}"
          - Effect: Allow
            Action:
            - "s3:DeleteObject"
            Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketName}/*"
          - Effect: Allow
            Action:
            - "logs:CreateLogGroup"
            - "logs:CreateLogStream"
            - "logs:PutLogEvents"
            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EmptyS3BucketLambda}:*"

  EmptyS3BucketLambda: 
    Type: "AWS::Lambda::Function"
    Properties: 
      Handler: "index.handler"
      Role: 
        Fn::GetAtt: 
          - "LambdaExecutionRole"
          - "Arn"
      Runtime: "python3.14"
      # we give the function a large timeout 
      # so we can wait for the bucket to be empty
      Timeout: 600
      Code: 
        ZipFile: |
          #!/usr/bin/env python
          # -*- coding: utf-8 -*-
          import json
          import boto3
          from urllib.request import Request, urlopen

          def handler(event, context):
              try:
                  bucket = event['ResourceProperties']['BucketName']

                  if event['RequestType'] == 'Delete':
                      s3 = boto3.resource('s3')
                      bucket = s3.Bucket(bucket)
                      for obj in bucket.objects.filter():
                          s3.Object(bucket.name, obj.key).delete()

                  sendResponseCfn(event, context, "SUCCESS")
              except Exception as e:
                  print(e)
                  sendResponseCfn(event, context, "FAILED")


          def sendResponseCfn(event, context, responseStatus):
              response_body = {'Status': responseStatus,
                              'Reason': 'Log stream name: ' + context.log_stream_name,
                              'PhysicalResourceId': context.log_stream_name,
                              'StackId': event['StackId'],
                              'RequestId': event['RequestId'],
                              'LogicalResourceId': event['LogicalResourceId'],
                              'Data': json.loads("{}")}

              response_data = json.dumps(response_body).encode('utf-8')
              request = Request(
                  event['ResponseURL'],
                  data=response_data,
                  headers={'content-type': '', 'content-length': str(len(response_data))},
                  method='PUT'
              )
              with urlopen(request) as response:
                  response.read()

Outputs:
  StackSSHSecurityGroup:
    Description: The ARN of the Lambda function that empties an S3 bucket
    Value: !GetAtt EmptyS3BucketLambda.Arn
    Export:
      Name: EmptyS3BucketLambda
